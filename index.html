<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="冰箱贴小世界" />
  <meta name="theme-color" content="#f8dfc0" />
  <title>冰箱贴小世界</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <div id="hud">
      <div id="title-card">
        <span id="scene-emoji"></span>
        <div>
          <div id="scene-name"></div>
          <div id="scene-style"></div>
          <div id="scene-materials" title="捡到的材料，以后回家合成用" hidden></div>
        </div>
      </div>

      <div id="top-buttons">
        <button id="btn-fridge" class="pill" title="打开冰箱，查看冰箱贴">🧊 冰箱</button>
        <button id="btn-reset" class="pill" title="回到全貌">🔭 全貌</button>
        <button id="btn-full" class="pill icon" title="全屏" hidden>⛶</button>
        <button id="btn-sound" class="pill icon" title="声音开关">🔊</button>
      </div>


      <div id="goal">
        <div id="goal-text"></div>
        <div id="slots"></div>
      </div>

      <div id="hint"></div>
      <div id="prompt" hidden></div>

      <!-- 触控：生活模式的虚拟摇杆和互动按钮 -->
      <div id="joystick" hidden><div class="stick"></div></div>
      <button id="btn-action" hidden></button>
    </div>

    <!-- 小游戏（大楼俄罗斯方块） -->
    <div id="game" hidden>
      <div id="game-bar">
        <span id="game-title"></span>
        <span id="game-status"></span>
        <button class="pill" data-k="exit">✕ 不玩了</button>
      </div>
      <div id="game-help"></div>
      <!-- 手机：Game Boy 式十字键（↑ 旋转，连按三下 ↓ 一落到底） -->
      <div id="game-pad">
        <div class="dpad">
          <div class="cross">
            <button class="up" data-k="rotate" aria-label="旋转">▲</button>
            <button class="left" data-k="left" aria-label="左移">◀</button>
            <span class="mid"></span>
            <button class="right" data-k="right" aria-label="右移">▶</button>
            <button class="down" data-k="down" aria-label="加速">▼</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tooltip" hidden></div>

    <!-- 小人主动打招呼时，头顶冒出来的话 -->
    <div id="speech" hidden>
      <div class="sp-name"></div>
      <div class="sp-text"></div>
    </div>

    <div id="dialog" hidden>
      <div class="dlg-name"></div>
      <div class="dlg-text"></div>
      <div class="dlg-next">▼</div>
    </div>

    <div id="toast-layer"></div>

    <div id="fridge" class="overlay" hidden>
      <div class="fridge-body">
        <div class="fridge-top">
          <div class="fridge-handle"></div>
          <div class="fridge-title">我的冰箱</div>
          <div id="magnets"></div>
          <div id="fridge-count"></div>
        </div>
        <div class="fridge-bottom">
          <div class="fridge-handle"></div>
        </div>
      </div>
      <button id="fridge-close" class="pill">关上冰箱</button>
    </div>

    <!-- 小屋的工作台：用捡来的材料做壁纸、地板 -->
    <div id="workbench" class="overlay" hidden>
      <div class="bench-card">
        <div class="bench-head">
          <div class="bench-title">🔨 工作台</div>
          <div id="bench-materials"></div>
        </div>
        <div id="bench-tabs"></div>
        <div id="bench-list"></div>
        <div id="bench-tip"></div>
      </div>
      <button id="bench-close" class="pill">收起工作台</button>
    </div>

    <div id="combine" class="overlay" hidden>
      <div class="combine-stage">
        <div id="combine-items"></div>
        <div id="combine-flash"></div>
        <div id="combine-magnet"></div>
      </div>
      <div id="combine-text"></div>
      <button id="combine-btn" class="pill big" hidden>贴到冰箱上 →</button>
    </div>

    <div id="intro" class="overlay" hidden>
      <div class="card">
        <div class="intro-magnet">🧲</div>
        <h1>冰箱贴小世界</h1>
        <p>每一块冰箱贴里，都藏着一个小小的世界。</p>
        <p>在当前世界里找到 <b>3 样隐藏的东西</b>，<br />它们会组合成下一块冰箱贴，带你去新的世界。</p>
        <ul class="only-mouse">
          <li>🚶 WASD / 方向键，或者<b>点哪走哪</b>，靠近东西就能捡起来</li>
          <li>🖱 拖动旋转 · 滚轮缩放，<b>拉远能看到整个小世界</b></li>
          <li>💬 走到小人旁边按 E，和他们聊聊天</li>
        </ul>
        <ul class="only-touch">
          <li>🚶 用左下角摇杆，或者<b>点哪走哪</b>，靠近东西就能捡起来</li>
          <li>👆 单指拖动旋转 · 双指缩放，<b>拉远能看到整个小世界</b></li>
          <li>💬 走到小人旁边点互动按钮，和他们聊聊天</li>
        </ul>
        <button id="intro-btn" class="pill big">开始收集！</button>
      </div>
    </div>

    <div id="ending" class="overlay" hidden>
      <div id="confetti"></div>
      <div class="card ending-card">
        <div class="polaroid">
          <div class="photo" id="ending-photo"></div>
          <div class="polaroid-caption">冰箱贴小世界 · 全家福</div>
        </div>
        <h1>全部冰箱贴集齐啦！</h1>
        <p id="ending-stats"></p>
        <p class="ending-names" id="ending-names"></p>
        <p>谢谢你走过每一个小小的世界 ♥</p>
        <div class="ending-buttons">
          <button id="ending-close" class="pill big">回到冰箱</button>
          <button id="ending-reset" class="pill">从头再玩一次</button>
        </div>
      </div>
    </div>

    <div id="fade"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
